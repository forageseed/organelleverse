[package]
name = "organelleverse_rust"
version = "0.0.1"
edition = "2021"
description = "Covariance-model acceleration for OrganelleVerse annotation"

[lib]
name = "organelleverse_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1.10"
mafft = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[patch.crates-io]
mafft-align = { path = "vendor/mafft-align" }
