schema = "organelleverse.capability.v1"

[capability]
id = "morphology.overlay"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Overlay"
description = "Render a colorized segmentation overlay on the source image."
keywords = ["analyze", "morphology", "overlay", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.morphology.measure:overlay"
side_effects = ["read_files", "write_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "PIL"

[[contract.dependencies]]
kind = "python"
name = "numpy"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "image"
codec = "path"

[[contract.binding.parameters]]
name = "label_map"
codec = "path"
