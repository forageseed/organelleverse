schema = "organelleverse.capability.v1"

[capability]
id = "diversity.neutral_tests"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Neutral Tests"
description = "Compute the standard neutral-equilibrium tests from an alignment."
keywords = ["analyze", "diversity", "neutral", "restored", "result", "tests"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.diversity.diversity:neutral_tests"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "allel"

[[contract.dependencies]]
kind = "python"
name = "numpy"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "alignment_fasta"
codec = "path"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { alignment_fasta = "fixtures/basic/input/alignment.fasta" }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
