schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_gfa_graph"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Gfa Graph"
description = "Render a GFA graph with Bandage/Bandage-NG (compute-only)."
keywords = ["analyze", "gfa", "graph", "plot", "restored", "result", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.gfa_graph:plot_gfa_graph"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "gfa"
codec = "path"

[[contract.binding.parameters]]
name = "organelle"
codec = "json"

[[contract.binding.parameters]]
name = "labels"
codec = "json"

[[contract.binding.parameters]]
name = "color_by"
codec = "json"

[[contract.binding.parameters]]
name = "width"
codec = "json"

[[contract.binding.parameters]]
name = "height"
codec = "json"

[[contract.binding.parameters]]
name = "font_size"
codec = "json"

[[contract.binding.parameters]]
name = "node_width"
codec = "json"

[[contract.binding.parameters]]
name = "edge_width"
codec = "json"

[[contract.binding.parameters]]
name = "edge_length"
codec = "json"

[[contract.binding.parameters]]
name = "outline"
codec = "json"

[[contract.binding.parameters]]
name = "node_length"
codec = "json"

[[contract.binding.parameters]]
name = "min_node_length"
codec = "json"

[[contract.binding.parameters]]
name = "text_outline"
codec = "json"

[[contract.binding.parameters]]
name = "center_labels"
codec = "json"

[[contract.binding.parameters]]
name = "single_arrowheads"
codec = "json"

[[contract.binding.parameters]]
name = "linear"
codec = "json"

[[contract.binding.parameters]]
name = "extra_args"
codec = "json"

[[contract.binding.parameters]]
name = "title"
codec = "json"

[[contract.binding.parameters]]
name = "layout"
codec = "json"

[[contract.binding.parameters]]
name = "dpi"
