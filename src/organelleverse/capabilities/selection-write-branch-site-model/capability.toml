schema = "organelleverse.capability.v1"

[capability]
id = "selection.write_branch_site_model"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Write Branch Site Model"
description = "Branch-site model: detect lineage-specific positive-selection sites."
keywords = ["analyze", "branch", "model", "restored", "result", "selection", "site", "write"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.models:write_branch_site_model"
side_effects = ["read_files", "write_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "alignment"
codec = "path"

[[contract.binding.parameters]]
name = "tree"
codec = "path"

[[contract.binding.parameters]]
name = "output_dir"
codec = "directory"
path_role = "output"

[[contract.binding.parameters]]
name = "run"
codec = "json"
