schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.iqtree_to_mrbayes_model"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "IQ-TREE To MrBayes Model"
description = "Map an IQ-TREE DNA model string to MrBayes lset/prset settings (nst, rates, statefreqpr) and flag inexact mappings."
keywords = ["analyze", "iqtree", "model", "mrbayes", "phylogeny", "substitution"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.partition:iqtree_to_mrbayes_model"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "mrbayes_model"

[[contract.binding.parameters]]
name = "model"
codec = "json"
