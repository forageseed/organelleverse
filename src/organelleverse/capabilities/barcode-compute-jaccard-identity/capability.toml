schema = "organelleverse.capability.v1"

[capability]
id = "barcode.compute_jaccard_identity"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Compute Jaccard Identity"
description = "Identify query against reference DB via k-mer Jaccard. Returns dict."
keywords = ["analyze", "barcode", "compute", "identity", "jaccard", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.barcode.barcode_core:compute_jaccard_identity"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "jaccard_identity"

[[contract.binding.parameters]]
name = "query_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "reference_fasta"
codec = "path"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { query_fasta = "fixtures/basic/input/query.fasta", reference_fasta = "fixtures/basic/input/reference.fasta" }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
