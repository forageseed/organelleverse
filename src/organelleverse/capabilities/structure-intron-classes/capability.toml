schema = "organelleverse.capability.v1"

[capability]
id = "structure.intron_classes"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Intron Classes"
description = "Count group I and group II introns in an organelle genome by Rfam covariance models (RF00028, RF00029) with Infernal cmsearch --cut_ga; works on bare sequence, unlike structure.introns."
keywords = ["cmsearch", "group", "infernal", "intron", "rfam", "structure"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.structure.intron_classes:intron_classes"
side_effects = ["read_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "genome_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "threads"
codec = "json"
