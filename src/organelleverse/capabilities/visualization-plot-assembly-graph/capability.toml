schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_assembly_graph"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Assembly Graph With Repeat Conformations"
description = "Draw a GFA assembly graph natively (no Bandage) with repeat-mediated recombination conformation insets; frequencies come from long reads spanning each repeat. Render with ov.write."
keywords = ["assembly", "bandage", "conformation", "gfa", "graph", "recombination", "repeat", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.assembly_graph:plot_assembly_graph"
side_effects = ["read_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[[contract.dependencies]]
kind = "python"
name = "scipy"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "gfa"
codec = "path"

[[contract.binding.parameters]]
name = "reads"
codec = "path"

[[contract.binding.parameters]]
name = "read_type"
codec = "json"

[[contract.binding.parameters]]
name = "title"
codec = "json"

[[contract.binding.parameters]]
name = "threads"
codec = "json"

[[contract.binding.parameters]]
name = "dpi"
codec = "json"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { gfa = "fixtures/basic/input/graph.gfa" }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
