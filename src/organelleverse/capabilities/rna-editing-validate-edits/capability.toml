schema = "organelleverse.capability.v1"

[capability]
id = "rna_editing.validate_edits"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Validate Edits"
description = "Validate predicted editing sites against RNA-seq evidence."
keywords = ["analyze", "edits", "restored", "result", "rna_editing", "validate"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.rna_editing.rna_edit:validate_edits"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "predicted_sites"
codec = "json"

[[contract.binding.parameters]]
name = "bam_path"
codec = "path"

[[contract.binding.parameters]]
name = "pileup_tsv"
codec = "path"
