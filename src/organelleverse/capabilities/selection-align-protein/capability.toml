schema = "organelleverse.capability.v1"

[capability]
id = "selection.align_protein"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Align Protein"
description = "Align protein sequences (MAFFT subprocess or self-contained)."
keywords = ["align", "analyze", "protein", "restored", "result", "selection"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.codeml:align_protein"
side_effects = ["read_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "protein_fasta"
codec = "path"
