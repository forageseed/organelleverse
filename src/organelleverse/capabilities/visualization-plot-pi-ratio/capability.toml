schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_pi_ratio"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Pi Ratio"
description = "Prepare a sliding-window nucleotide-diversity ratio (pi_A / pi_B, Nei 1987) between two groups from an alignment or a reference + VCF pseudo-alignment; peaks are marked with the overlapping gene; render with ov.write."
keywords = ["diversity", "nucleotide-diversity", "pi", "population", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.popgen_plots:plot_pi_ratio"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[[contract.dependencies]]
kind = "python"
name = "scipy"

[[contract.dependencies]]
kind = "python"
name = "Bio"
locator = "biopython"

[[contract.dependencies]]
kind = "python"
name = "vcfpy"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "groups"
codec = "json"

[[contract.binding.parameters]]
name = "alignment"
codec = "path"

[[contract.binding.parameters]]
name = "vcf"
codec = "path"

[[contract.binding.parameters]]
name = "reference_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "reference"
codec = "json"

[[contract.binding.parameters]]
name = "pair"
codec = "json"

[[contract.binding.parameters]]
name = "window_size"
codec = "json"

[[contract.binding.parameters]]
name = "step"
codec = "json"

[[contract.binding.parameters]]
name = "gap_mode"
codec = "json"

[[contract.binding.parameters]]
name = "min_sites"
codec = "json"

[[contract.binding.parameters]]
name = "pseudocount"
codec = "json"

[[contract.binding.parameters]]
name = "contig"
codec = "json"

[[contract.binding.parameters]]
name = "reference_sample"
codec = "json"

[[contract.binding.parameters]]
