schema = "organelleverse.capability.v1"

[capability]
id = "selection.likelihood_ratio_test"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Likelihood Ratio Test"
description = "Likelihood ratio test: 2*(lnL_alt - lnL_null) ~ \u03c7\u00b2(df)."
keywords = ["analyze", "likelihood", "ratio", "restored", "result", "selection", "test"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.models:likelihood_ratio_test"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "lrt"

[[contract.binding.parameters]]
name = "lnL_null"
codec = "json"

[[contract.binding.parameters]]
name = "lnL_alt"
codec = "json"

[[contract.binding.parameters]]
name = "df"
codec = "json"
