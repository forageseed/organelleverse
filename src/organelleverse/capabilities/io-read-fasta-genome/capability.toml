schema = "organelleverse.capability.v1"

[capability]
id = "io.read_fasta_genome"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Read a FASTA organelle genome"
description = "Reads an organelle genome sequence from a FASTA file into a canonical OrganelleGenome, tagged with its organelle type and species."
keywords = ["fasta", "genome", "io"]
execution_mode = "inline"
stage = "read"
input_kind = "none"
output_kind = "genome"
callable_locator = "organelleverse.io_genome:read_fasta_genome"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false
