schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_ir_boundaries"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot IR Boundaries"
description = "Prepare an IRscope-style LSC/IRb/SSC/IRa junction panel for several plastomes with junction-crossing and flanking genes and their bp distances; render with ov.write."
keywords = ["boundary", "irscope", "plastome", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.paper_figures:plot_ir_boundaries"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[[contract.dependencies]]
kind = "python"
name = "Bio"
locator = "biopython"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "genbank_path"
codec = "path"

[[contract.binding.parameters]]
name = "names"
codec = "json"

[[contract.binding.parameters]]
name = "window"
codec = "json"

[[contract.binding.parameters]]
name = "genes_per_side"
codec = "json"

[[contract.binding.parameters]]
name = "width"
codec = "json"

[[contract.binding.parameters]]
name = "dpi"
codec = "json"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { genbank_path = ["fixtures/basic/input/a.gb", "fixtures/basic/input/b.gb"], names = ["Alpha one", "Beta two"] }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
