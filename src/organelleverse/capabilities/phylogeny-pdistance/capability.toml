schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.pdistance"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Pdistance"
description = "Uncorrected p-distance (number of differing ACGT columns)."
keywords = ["analyze", "pdistance", "phylogeny", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.hapnet:pdistance"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "p_distance"

[[contract.binding.parameters]]
name = "a"
codec = "json"

[[contract.binding.parameters]]
name = "b"
codec = "json"
