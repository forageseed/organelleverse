schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_tree_conflict"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Tree Conflict"
description = "Prepare face-to-face trees of the same taxa from different genomes (e.g. nuclear vs mitochondrial vs plastid) with every clade classed as shared, conflicting, supported conflict or unresolved, plus Robinson-Foulds distances; render with ov.write."
keywords = ["conflict", "cytonuclear", "discordance", "phylogeny", "tanglegram", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.tree_plots:plot_tree_conflict"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[[contract.dependencies]]
kind = "python"
name = "Bio"
locator = "biopython"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "trees"
codec = "path"

[[contract.binding.parameters]]
name = "names"
codec = "json"

[[contract.binding.parameters]]
name = "rename"
codec = "json"

[[contract.binding.parameters]]
name = "outgroup"
codec = "json"

[[contract.binding.parameters]]
name = "midpoint_root"
codec = "json"

[[contract.binding.parameters]]
name = "support_threshold"
codec = "json"

[[contract.binding.parameters]]
name = "posterior_threshold"
codec = "json"

[[contract.binding.parameters]]
name = "width"
codec = "json"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { trees = ["fixtures/basic/input/nuclear.nwk", "fixtures/basic/input/mito.nwk", "fixtures/basic/input/plastid.nwk"], names = ["Nuclear", "Mitochondrion", "Plastid"], outgroup = ["Amborella trichopoda"] }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
