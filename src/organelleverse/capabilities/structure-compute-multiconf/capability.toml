schema = "organelleverse.capability.v1"

[capability]
id = "structure.compute_multiconf"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Compute Multiconf"
description = "Detect repeat-mediated multi-configurations. Returns dict."
keywords = ["analyze", "compute", "multiconf", "restored", "result", "structure"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.structure.structure_core:compute_multiconf"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "multiconf"

[[contract.binding.parameters]]
name = "fasta_path"
codec = "path"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { fasta_path = "fixtures/basic/input/multiconf.fasta" }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
