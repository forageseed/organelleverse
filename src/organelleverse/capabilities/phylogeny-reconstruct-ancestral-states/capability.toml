schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.reconstruct_ancestral_states"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Reconstruct Ancestral States"
description = "Marginal posteriors and endpoint state changes on a supplied rooted tree under the equal-rates Mk model."
keywords = ["ancestral", "gene", "phylogeny", "traits"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.ancestral:reconstruct_ancestral_states"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "tree_newick"
codec = "path"

[[contract.binding.parameters]]
name = "traits"
codec = "json"

[[contract.binding.parameters]]
name = "state_space"
codec = "json"

[[contract.binding.parameters]]
name = "rate"
codec = "json"

[[contract.binding.parameters]]
name = "rate_bounds"
codec = "json"

[[fixture]]
case = "binary"
input = { kind = "none" }
parameters = { tree_newick = "fixtures/binary/input/tree.nwk", traits = { A = { gene = 0 }, B = { gene = 0 }, C = { gene = 1 } }, rate = 1.0 }
expect = "fixtures/binary/expected.json"
equivalence = "numeric_tolerance"
tolerance = 1e-10
