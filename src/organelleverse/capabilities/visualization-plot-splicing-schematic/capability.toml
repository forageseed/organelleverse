schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_splicing_schematic"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Splicing Schematic"
description = "Render trans-spliced exon fragments and their gene-level connections (compute-only)."
keywords = ["analyze", "plot", "restored", "result", "schematic", "splicing", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:plot_splicing_schematic"
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "genes"
codec = "json"
