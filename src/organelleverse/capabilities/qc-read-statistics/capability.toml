schema = "organelleverse.capability.v1"

[capability]
id = "qc.read_statistics"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Summarize FASTQ reads"
description = "Streaming read counts, bases, N50, mean and median length, base-weighted mean Phred+33 quality."
keywords = ["fastq", "quality-control", "reads"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.quality_control.api:read_statistics"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "reads"
codec = "path"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { reads = "fixtures/basic/input/reads.fastq" }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
