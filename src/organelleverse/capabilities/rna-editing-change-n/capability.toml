schema = "organelleverse.capability.v1"

[capability]
id = "rna_editing.change_n"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Change N"
description = "Replace every non-ACGT base with ``N`` (uppercase)."
keywords = ["analyze", "change", "n", "restored", "result", "rna_editing"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.rna_editing._plantc2u:change_n"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "sequence"

[[contract.binding.parameters]]
name = "seq"
codec = "json"
