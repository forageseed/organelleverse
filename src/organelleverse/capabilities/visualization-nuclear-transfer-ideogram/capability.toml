schema = "organelleverse.capability.v1"

[capability]
id = "visualization.nuclear_transfer_ideogram"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Nuclear Transfer Ideogram"
description = "Prepare a NUMT/NUPT chromosome ideogram without writing files."
keywords = ["analyze", "ideogram", "nuclear", "restored", "result", "transfer", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:nuclear_transfer_ideogram"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "chromosomes"
codec = "json"

[[contract.binding.parameters]]
name = "fragments"
codec = "json"

[[contract.binding.parameters]]
name = "title"
codec = "json"

[[contract.binding.parameters]]
name = "panel_label"
codec = "json"

[[contract.binding.parameters]]
name = "max_mb"
codec = "json"

[[contract.binding.parameters]]
name = "transfer_label"
codec = "json"

[[contract.binding.parameters]]
name = "color_by"
codec = "json"

[[contract.binding.parameters]]
name = "show_density"
codec = "json"

[[contract.binding.parameters]]
name = "density_window"
codec = "json"

[[contract.binding.parameters]]
name = "label_top"
codec = "json"

[[contract.binding.parameters]]
name = "centromeres"
codec = "json"

[[contract.binding.parameters]]
name = "chromosome_order"
codec = "json"

[[contract.binding.parameters]]
name = "nuclear_annotated"
codec = "json"
