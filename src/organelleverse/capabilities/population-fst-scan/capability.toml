schema = "organelleverse.capability.v1"

[capability]
id = "population.fst_scan"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Fst Scan"
description = "Compute windowed F_ST between two populations from a VCF."
keywords = ["analyze", "fst", "population", "restored", "result", "scan"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.population.population:fst_scan"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "vcf_path"
codec = "path"

[[contract.binding.parameters]]
name = "pop_assignments"
codec = "json"
