schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_ogdraw_map"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Ogdraw Map"
description = "One-step OGDraw-style map: parse a GenBank file then draw (OGDrawR port)."
keywords = ["analyze", "map", "ogdraw", "plot", "restored", "result", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.ogdraw:plot_ogdraw_map"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "genbank_path"
codec = "path"
