schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.haplotype_network"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Haplotype Network"
description = "Build a TCS / median-joining / minimum-spanning haplotype network."
keywords = ["analyze", "haplotype", "network", "phylogeny", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.hapnet:haplotype_network"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "alignment_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "method"
codec = "json"

[[contract.binding.parameters]]
name = "connection_limit"
codec = "json"

[[contract.binding.parameters]]
name = "confidence"
codec = "json"

[[contract.binding.parameters]]
name = "epsilon"
codec = "json"

[[contract.binding.parameters]]
name = "population_map"
codec = "json"

[[contract.binding.parameters]]
name = "title"
codec = "json"

[[contract.binding.parameters]]
name = "backend"
codec = "json"
