schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_gbdraw"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Gbdraw"
description = "Render a genome diagram with the external ``gbdraw`` backend (compute-only)."
keywords = ["analyze", "gbdraw", "plot", "restored", "result", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.gbdraw:plot_gbdraw"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

