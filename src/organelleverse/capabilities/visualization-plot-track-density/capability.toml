schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_track_density"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Track Density"
description = "Render aligned genomic-position tracks (compute-only)."
keywords = ["analyze", "density", "plot", "restored", "result", "track", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:plot_track_density"
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "tracks"
codec = "json"
