schema = "organelleverse.capability.v1"

[capability]
id = "composition.gc_content"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Gc Content"
description = "Compute global + windowed GC content (and GC skew) from a FASTA."
keywords = ["analyze", "composition", "content", "gc", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.composition.gc:gc_content"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "genome_fasta"
codec = "path"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { genome_fasta = "fixtures/basic/input/genome.fasta" }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
