schema = "organelleverse.capability.v1"

[capability]
id = "comparative.detect_structural_variants"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Detect Structural Variants"
description = "Classify minimap2 anchors against a maximum-weight collinear backbone; report inversions, translocations, duplicate alignments and CIGAR indels with explicit circular and SSC orientation operations."
keywords = ["comparative", "duplication", "inversion", "synteny", "translocation"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.comparative.structural:detect_structural_variants"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "mappy"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "reference_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "query_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "preset"
codec = "json"

[[contract.binding.parameters]]
name = "min_size"
codec = "json"

[[contract.binding.parameters]]
name = "topology"
codec = "json"

[[contract.binding.parameters]]
name = "plastome"
codec = "json"

[[fixture]]
case = "inversion"
input = { kind = "none" }
parameters = { reference_fasta = "fixtures/inversion/input/reference.fa", query_fasta = "fixtures/inversion/input/query.fa", topology = "linear" }
expect = "fixtures/inversion/expected.json"
equivalence = "exact"
