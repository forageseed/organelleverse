schema = "organelleverse.capability.v1"

[capability]
id = "coevolution.rate_covariation"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Rate Covariation"
description = "Compute pairwise ERC (evolutionary rate covariation)."
keywords = ["analyze", "coevolution", "covariation", "rate", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.coevolution.coevolution:rate_covariation"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "branch_lengths"
codec = "json"
