schema = "organelleverse.capability.v1"

[capability]
id = "visualization.classify_gene"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Classify Gene"
description = "Classify a gene name into an OGDraw functional category."
keywords = ["analyze", "classify", "gene", "restored", "result", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.ogdraw:classify_gene"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "gene_class"

[[contract.binding.parameters]]
name = "name"
codec = "json"
