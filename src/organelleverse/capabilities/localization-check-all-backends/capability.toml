schema = "organelleverse.capability.v1"

[capability]
id = "localization.check_all_backends"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Check All Backends"
description = "Check all localization backends. Returns {name: status_dict}."
keywords = ["all", "analyze", "backends", "check", "localization", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.localization.install:check_all_backends"
side_effects = ["subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "backend_status"
