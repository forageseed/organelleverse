schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.render_network"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Render Network"
description = "Prepare a haplotype-network figure for explicit materialization."
keywords = ["analyze", "network", "phylogeny", "render", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.hapnet:render_network"
side_effects = ["write_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "haplotypes"
codec = "json"

[[contract.binding.parameters]]
name = "members"
codec = "json"

[[contract.binding.parameters]]
name = "freq"
codec = "json"

[[contract.binding.parameters]]
name = "edges"
codec = "json"
