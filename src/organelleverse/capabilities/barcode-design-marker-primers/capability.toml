schema = "organelleverse.capability.v1"

[capability]
id = "barcode.design_marker_primers"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Design Marker Primers"
description = "Design cross-sample-conserved marker primer pairs around the alignment's hypervariable regions (高变区) with primer3-py; reports amplicon π, haplotype resolution and primer mismatches."
keywords = ["analyze", "barcode", "design", "marker", "primer", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.barcode.primers:design_marker_primers"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "primer3"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "alignment_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "window_size"
codec = "json"

[[contract.binding.parameters]]
name = "step"
codec = "json"

[[contract.binding.parameters]]
name = "product_size_min"
codec = "json"

[[contract.binding.parameters]]
name = "product_size_max"
codec = "json"

[[contract.binding.parameters]]
name = "max_primer_mismatches"
codec = "json"

[[contract.binding.parameters]]
name = "max_candidates"
codec = "json"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { alignment_fasta = "fixtures/basic/input/alignment.fasta", window_size = 100, step = 50, product_size_min = 120, product_size_max = 220 }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
