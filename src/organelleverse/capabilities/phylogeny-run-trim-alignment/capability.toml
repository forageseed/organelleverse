schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.run_trim_alignment"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Run Trim Alignment"
description = "Plan or run trimAl with intermediate files in managed storage."
keywords = ["alignment", "analyze", "phylogeny", "restored", "result", "run", "trim"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.service:run_trim_alignment"
side_effects = ["write_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "alignment_fasta"
codec = "path"
