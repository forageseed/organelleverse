schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_structure_map"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Organelle Structure Map"
description = "Prepare an OGDraw map with annotation-backed cis/trans exon panels, repeat tracks and optional plastome IR regions; render with ov.write."
keywords = ["cpgview", "pmgmap", "splicing", "structure", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.structure_maps:plot_structure_map"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[[contract.dependencies]]
kind = "python"
name = "biopython"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "genbank_path"
codec = "path"

[[contract.binding.parameters]]
name = "ssrs"
codec = "json"

[[contract.binding.parameters]]
name = "tandem_repeats"
codec = "json"

[[contract.binding.parameters]]
name = "dispersed_repeats"
codec = "json"

[[contract.binding.parameters]]
name = "genome_name"
codec = "json"

[[contract.binding.parameters]]
name = "show_ir"
codec = "json"

[[contract.binding.parameters]]
name = "dpi"
codec = "json"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { genbank_path = "fixtures/basic/input/structure.gb", ssrs = [{start = 1, end = 10}], tandem_repeats = [{start = 20, end = 50}], dispersed_repeats = [{positions = [70, 900], length = 20}] }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
