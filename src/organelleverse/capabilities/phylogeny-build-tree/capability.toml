schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.build_tree"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Build Tree"
description = "Build a publication-grade ML phylogenetic tree, or return its plan."
keywords = ["analyze", "build", "phylogeny", "restored", "result", "tree"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.phylo:build_tree"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "alignment_fasta"
codec = "path"
