schema = "organelleverse.capability.v1"

[capability]
id = "selection.write_codeml_inputs"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Write Codeml Inputs"
description = "One-call pipeline: CDS \u2192 validate \u2192 translate \u2192 align \u2192 PAL2NAL \u2192 PAML."
keywords = ["analyze", "codeml", "inputs", "restored", "result", "selection", "write"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.codeml:write_codeml_inputs"
side_effects = ["read_files", "write_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "cds_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "output_dir"
codec = "directory"
path_role = "output"
