schema = "organelleverse.capability.v1"

[capability]
id = "localization.score_transit_peptides"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Score Transit Peptides"
description = "Score mitochondrial (mTP) and chloroplast (cTP) transit peptides."
keywords = ["analyze", "localization", "peptides", "restored", "result", "score", "transit"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.localization.localize_core:score_transit_peptides"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "transit_peptides"

[[contract.binding.parameters]]
name = "seq"
codec = "json"
