schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.build_partitioned_supermatrix"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Build Partitioned Supermatrix"
description = "Codon-align shared CDS from annotated GenBank genomes into a gene/codon-position partitioned supermatrix with a NEXUS partition file."
keywords = ["analyze", "codon", "concatenate", "partition", "phylogeny", "supermatrix"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.service:build_partitioned_supermatrix"
side_effects = ["read_files", "write_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "Bio"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "genbank_paths"
codec = "path"

[[contract.binding.parameters]]
name = "genes"
codec = "json"

[[contract.binding.parameters]]
name = "taxon_names"
codec = "json"

[[contract.binding.parameters]]
name = "codon_positions"
codec = "json"

[[contract.binding.parameters]]
name = "min_taxa_fraction"
codec = "json"

[[contract.binding.parameters]]
name = "min_codons"
codec = "json"

[[contract.binding.parameters]]
name = "max_length_deviation"
codec = "json"

[[contract.binding.parameters]]
name = "genetic_code"
codec = "json"
