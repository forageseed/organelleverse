schema = "organelleverse.capability.v1"

[capability]
id = "transfer.detect_transfers_evidence"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Detect Transfers Evidence"
description = "Three-evidence NUMT/NUPT pipeline (BLASTN \u2192 gene map \u2192 depth \u2192 long-read)."
keywords = ["analyze", "detect", "evidence", "restored", "result", "transfer", "transfers"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.transfer.transfer:detect_transfers_evidence"
side_effects = ["read_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "nuclear_fasta"
codec = "path"
