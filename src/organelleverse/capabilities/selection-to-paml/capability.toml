schema = "organelleverse.capability.v1"

[capability]
id = "selection.to_paml"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "To Paml"
description = "Convert a FASTA alignment to PAML (sequential) format."
keywords = ["analyze", "paml", "restored", "result", "selection", "to"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.codeml:to_paml"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "alignment_fasta"
codec = "path"
