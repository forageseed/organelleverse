schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_selection_summary"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Selection Summary"
description = "Render a gene-level selection-pressure summary (compute-only)."
keywords = ["analyze", "plot", "restored", "result", "selection", "summary", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:plot_selection_summary"
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "records"
codec = "json"
