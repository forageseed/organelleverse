schema = "organelleverse.capability.v1"

[capability]
id = "coevolution.perm_test"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Perm Test"
description = "Permutation test: is within-set mean ERC higher than random?"
keywords = ["analyze", "coevolution", "perm", "restored", "result", "test"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.coevolution.erc_engine:perm_test"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "perm_test"

[[contract.binding.parameters]]
name = "gene_set"
codec = "json"

[[contract.binding.parameters]]
name = "cor"
codec = "json"
