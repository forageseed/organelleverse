schema = "organelleverse.capability.v1"

[capability]
id = "ppr.predict_binding_sites"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Predict Candidate PPR Binding Sequences"
description = "Map pre-annotated canonical 35-aa P-class PPR repeat codes to RNA bases and report exact candidate sequence matches in transcript-oriented organelle RNA FASTA records. This is not domain detection or binding-affinity prediction."
keywords = ["binding_site", "candidate_sequence", "organelle", "ppr", "rna"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
organelle_types = ["mitochondrion", "plastid"]
callable_locator = "organelleverse.ppr.predict:predict_binding_sites"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "repeat_tsv"
codec = "path"

[[contract.binding.parameters]]
name = "transcript_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "organelle"
codec = "json"

[[contract.binding.parameters]]
name = "extended_code_map_json"
codec = "json"

