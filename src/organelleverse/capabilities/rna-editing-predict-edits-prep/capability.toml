schema = "organelleverse.capability.v1"

[capability]
id = "rna_editing.predict_edits_prep"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Predict Edits Prep"
description = "Positional C-to-U editing prediction (codon-residue-change scanner; inspired by PREP-Mt's conservation principle but simplified)."
keywords = ["analyze", "edits", "genome", "predict", "prep", "restored", "result", "rna_editing"]
execution_mode = "inline"
stage = "analyze"
input_kind = "genome"
output_kind = "result"
callable_locator = "organelleverse.rna_editing.rna_edit:predict_edits_prep"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "canonical_core"
result_codec = "canonical"
