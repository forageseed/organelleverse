schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.run_astral"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Infer ASTRAL Species Tree"
description = "Infer an organelle species-tree from locus gene-trees and report ASTRAL local quartet support."
keywords = ["astral", "discordance", "gene-tree", "phylogeny", "species-tree"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.astral:run_astral"
side_effects = ["write_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "gene_trees"
codec = "path"

[[contract.binding.parameters]]
name = "astral_jar"
codec = "path"

[[contract.binding.parameters]]
name = "java"
codec = "json"
