schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_tree"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Tree"
description = "Draw a phylogenetic tree (compute-only)."
keywords = ["analyze", "plot", "restored", "result", "tree", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.plots:plot_tree"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "newick_path"
codec = "path"

[[contract.binding.parameters]]
name = "title"
codec = "json"

[[contract.binding.parameters]]
name = "layout"
codec = "json"

[[contract.binding.parameters]]
name = "dpi"
codec = "json"

[[contract.binding.parameters]]
name = "width"
codec = "json"

[[contract.binding.parameters]]
name = "height"
codec = "json"

[[contract.binding.parameters]]
name = "method"
codec = "json"

[[contract.binding.parameters]]
name = "show_support"
codec = "json"

[[contract.binding.parameters]]
name = "italic_labels"
codec = "json"
