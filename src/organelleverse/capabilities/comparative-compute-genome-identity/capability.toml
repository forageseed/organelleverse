schema = "organelleverse.capability.v1"

[capability]
id = "comparative.compute_genome_identity"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Compute Genome Identity"
description = "Compute mVISTA-style per-window identity of queries against one reference."
keywords = ["analyze", "comparative", "compute", "genome", "identity", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.comparative.identity:compute_genome_identity"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "mappy"

[[contract.dependencies]]
kind = "python"
name = "edlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "genome_identity"

[[contract.binding.parameters]]
name = "reference_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "query_fastas"
codec = "path"

[[contract.binding.parameters]]
name = "reference_genbank"
codec = "path"

[[fixture]]
case = "single_query"
input = { kind = "none" }
parameters = { reference_fasta = "fixtures/single_query/input/reference.fasta", query_fastas = ["fixtures/single_query/input/query_a.fasta"] }
expect = "fixtures/single_query/expected.json"
equivalence = "exact"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { reference_fasta = "fixtures/basic/input/reference.fasta", query_fastas = ["fixtures/basic/input/query_a.fasta", "fixtures/basic/input/query_b.fasta"] }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
