schema = "organelleverse.capability.v1"

[capability]
id = "coevolution.run_orthofinder"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Run Orthofinder"
description = "Plan or run OrthoFinder with generated files in a managed run directory."
keywords = ["analyze", "coevolution", "orthofinder", "restored", "result", "run"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.coevolution.service:run_orthofinder"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "proteome_dir"
codec = "directory"
path_role = "input"
