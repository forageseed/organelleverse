schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.tcs_connection_limit"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Tcs Connection Limit"
description = "Maximum connection distance for the 95% parsimony criterion."
keywords = ["analyze", "connection", "limit", "phylogeny", "restored", "result", "tcs"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.hapnet:tcs_connection_limit"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "tcs_connection_limit"

[[contract.binding.parameters]]
name = "n_haplotypes"
codec = "json"
