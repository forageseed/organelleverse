schema = "organelleverse.capability.v1"

[capability]
id = "pangenome.pan_repeats"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Pan Repeats"
description = "Detect repeats shared across genomes (k-mer based)."
keywords = ["analyze", "genome", "pan", "pangenome", "repeats", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "genome"
input_sequence = true
output_kind = "result"
callable_locator = "organelleverse.pangenome.pangenome:pan_repeats"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "canonical_core"
result_codec = "canonical"
