schema = "organelleverse.capability.v1"

[capability]
id = "visualization.write_visualization_preview_report"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Write Visualization Preview Report"
description = "Write a static HTML gallery for generated visualization previews."
keywords = ["analyze", "preview", "report", "restored", "result", "visualization", "write"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:write_visualization_preview_report"
side_effects = ["write_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "figures"
codec = "json"

[[contract.binding.parameters]]
name = "output_html"
codec = "path"
path_role = "output"
