schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_erc_pair_scatter"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Erc Pair Scatter"
description = "Render branch-level ERC rates for one candidate gene pair (compute-only)."
keywords = ["analyze", "erc", "pair", "plot", "restored", "result", "scatter", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:plot_erc_pair_scatter"
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "points"
codec = "json"
