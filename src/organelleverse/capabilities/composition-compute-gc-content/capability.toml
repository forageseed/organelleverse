schema = "organelleverse.capability.v1"

[capability]
id = "composition.compute_gc_content"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Compute Gc Content"
description = "Compute GC content + GC skew. Returns dict (not OrganelleResult)."
keywords = ["analyze", "composition", "compute", "content", "gc", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.composition.gc_core:compute_gc_content"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "gc_metrics"

[[contract.binding.parameters]]
name = "fasta_path"
codec = "path"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { fasta_path = "fixtures/basic/input/genome.fasta" }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
