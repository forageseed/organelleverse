schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_repeat_summary"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Repeat Summary"
description = "Prepare SSR type, motif-class and dispersed-repeat length-class panels for one or more genomes from the existing repeat analyses; render with ov.write."
keywords = ["misa", "repeats", "ssr", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.paper_figures:plot_repeat_summary"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[[contract.dependencies]]
kind = "python"
name = "numpy"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "fasta_path"
codec = "path"

[[contract.binding.parameters]]
name = "ssrs"
codec = "json"

[[contract.binding.parameters]]
name = "repeats"
codec = "json"

[[contract.binding.parameters]]
name = "names"
codec = "json"

[[contract.binding.parameters]]
name = "min_repeat_len"
codec = "json"

[[contract.binding.parameters]]
name = "top_motifs"
codec = "json"

[[contract.binding.parameters]]
name = "width"
codec = "json"

[[contract.binding.parameters]]
name = "height_mm"
codec = "json"

[[contract.binding.parameters]]
name = "dpi"
codec = "json"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { fasta_path = ["fixtures/basic/input/g.fasta"], min_repeat_len = 30 }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
