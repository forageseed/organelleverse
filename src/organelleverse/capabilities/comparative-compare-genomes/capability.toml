schema = "organelleverse.capability.v1"

[capability]
id = "comparative.compare_genomes"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Compare Genomes"
description = "Compare genome structure: sizes, gene counts, GC."
keywords = ["analyze", "comparative", "compare", "genome", "genomes", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "genome"
input_sequence = true
output_kind = "result"
callable_locator = "organelleverse.comparative.compare:compare_genomes"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "canonical_core"
result_codec = "canonical"
