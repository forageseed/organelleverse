schema = "organelleverse.capability.v1"

[capability]
id = "localization.score_pts"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Score Pts"
description = "Detect peroxisomal targeting signals PTS1 (C-term) and PTS2 (N-term)."
keywords = ["analyze", "localization", "pts", "restored", "result", "score"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.localization.localize_core:score_pts"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "pts"

[[contract.binding.parameters]]
name = "seq"
codec = "json"
