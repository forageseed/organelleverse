schema = "organelleverse.capability.v1"

[capability]
id = "rna_editing.extract_windows"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Extract Windows"
description = "Extract 41-nt windows centred on every cytidine (port of upstream)."
keywords = ["analyze", "extract", "restored", "result", "rna_editing", "windows"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.rna_editing._deepred:extract_windows"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "windows"

[[contract.binding.parameters]]
name = "fin"
codec = "path"
