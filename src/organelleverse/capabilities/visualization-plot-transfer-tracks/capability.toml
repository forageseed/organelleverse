schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_transfer_tracks"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Transfer Tracks"
description = "Render NUMT/NUPT insertions as dots on linear chromosome tracks (compute-only)."
keywords = ["analyze", "plot", "restored", "result", "tracks", "transfer", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:plot_transfer_tracks"
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "candidates"
codec = "json"
