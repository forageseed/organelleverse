schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_transfer_tracks"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Transfer Tracks"
description = "Render NUMT/NUPT insertions on linear chromosome tracks (compute-only)."
keywords = ["analyze", "plot", "restored", "result", "tracks", "transfer", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:plot_transfer_tracks"
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "candidates"
codec = "json"

[[contract.binding.parameters]]
name = "nuclear_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "chromosome_lengths"
codec = "json"

[[contract.binding.parameters]]
name = "color_by"
codec = "json"

[[contract.binding.parameters]]
name = "title"
codec = "json"

[[contract.binding.parameters]]
name = "transfer_label"
codec = "json"

[[contract.binding.parameters]]
name = "centromeres"
codec = "json"

[[contract.binding.parameters]]
name = "chromosome_order"
codec = "json"

[[contract.binding.parameters]]
name = "show_density"
codec = "json"

[[contract.binding.parameters]]
name = "density_window"
codec = "json"

[[contract.binding.parameters]]
name = "label_top"
codec = "json"

[[contract.binding.parameters]]
name = "min_chromosome_fraction"
codec = "json"

[[contract.binding.parameters]]
name = "panel_label"
codec = "json"

[[contract.binding.parameters]]
name = "width"
codec = "json"

[[contract.binding.parameters]]
name = "height"
codec = "json"
