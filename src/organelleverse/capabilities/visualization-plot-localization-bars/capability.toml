schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_localization_bars"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Localization Bars"
description = "Render per-protein subcellular-localization probabilities (compute-only)."
keywords = ["analyze", "bars", "localization", "plot", "restored", "result", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:plot_localization_bars"
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "predictions"
codec = "json"
