schema = "organelleverse.capability.v1"

[capability]
id = "comparative.gene_table"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Gene Table"
description = "Generate a gene presence/absence matrix across genomes."
keywords = ["analyze", "comparative", "gene", "genome", "restored", "result", "table"]
execution_mode = "inline"
stage = "analyze"
input_kind = "genome"
input_sequence = true
output_kind = "result"
callable_locator = "organelleverse.comparative.compare:gene_table"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "canonical_core"
result_codec = "canonical"
