schema = "organelleverse.capability.v1"

[capability]
id = "hgt.detect_hgt"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Detect Hgt"
description = "Detect horizontal gene transfer from donor to recipient."
keywords = ["analyze", "detect", "hgt", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.hgt.hgt:detect_hgt"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "donor_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "recipient_fasta"
codec = "path"
