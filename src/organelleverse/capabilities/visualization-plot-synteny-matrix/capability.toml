schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_synteny_matrix"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Synteny Matrix"
description = "Prepare a synteny matrix without writing; render it with ``ov.write``."
keywords = ["analyze", "matrix", "plot", "restored", "result", "synteny", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:plot_synteny_matrix"
side_effects = ["write_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "blocks"
codec = "json"
