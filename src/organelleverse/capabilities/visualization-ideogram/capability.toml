schema = "organelleverse.capability.v1"

[capability]
id = "visualization.ideogram"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Ideogram"
description = "Prepare a RIdeogram-style chromosome plot object without writing files."
keywords = ["analyze", "ideogram", "restored", "result", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:ideogram"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "karyotype"
codec = "json"
