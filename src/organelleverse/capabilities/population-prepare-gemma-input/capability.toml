schema = "organelleverse.capability.v1"

[capability]
id = "population.prepare_gemma_input"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Prepare Gemma Input"
description = "Plan or run GEMMA input preparation in a managed run directory."
keywords = ["analyze", "gemma", "input", "population", "prepare", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.population.service:prepare_gemma_input"
side_effects = ["subprocess", "write_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "vcf_path"
codec = "path"

[[contract.binding.parameters]]
name = "phenotype"
codec = "path"
