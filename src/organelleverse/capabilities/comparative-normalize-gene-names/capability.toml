schema = "organelleverse.capability.v1"

[capability]
id = "comparative.normalize_gene_names"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Normalize Gene Names"
description = "Normalize gene-name variants. Returns {input: canonical}."
keywords = ["analyze", "comparative", "gene", "names", "normalize", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.comparative.compare_core:normalize_gene_names"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "gene_name_map"

[[contract.binding.parameters]]
name = "names"
codec = "json"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { names = ["nu1", "coxi", "cytb", "unknown_gene"] }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
