schema = "organelleverse.capability.v1"

[capability]
id = "selection.prepare_codeml"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Prepare Codeml"
description = "Prepare codeml-ready metrics without writing user-facing outputs."
keywords = ["analyze", "codeml", "prepare", "restored", "result", "selection"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.codeml:prepare_codeml"
side_effects = ["read_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "cds_fasta"
codec = "path"
