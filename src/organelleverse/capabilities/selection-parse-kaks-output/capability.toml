schema = "organelleverse.capability.v1"

[capability]
id = "selection.parse_kaks_output"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Parse Kaks Output"
description = "Parse KaKs_Calculator output TSV."
keywords = ["analyze", "kaks", "output", "parse", "restored", "result", "selection"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.kaks_calculator:parse_kaks_output"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "kaks_hits"

[[contract.binding.parameters]]
name = "output_file"
codec = "path"
