schema = "organelleverse.capability.v1"

[capability]
id = "selection.parse_codeml_output"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Parse Codeml Output"
description = "Parse a codeml output file for lnL, \u03c9, kappa, and BEB sites."
keywords = ["analyze", "codeml", "output", "parse", "restored", "result", "selection"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.models:parse_codeml_output"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "codeml_output"

[[contract.binding.parameters]]
name = "out_path"
codec = "path"
