schema = "organelleverse.capability.v1"

[capability]
id = "fetch.refseq_snapshot"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Fetch a RefSeq organelle release snapshot"
description = "Downloads organelle records from NCBI's retained current RefSeq release and records the resolved release number. A null release selects the current release; an explicit release must match it."
keywords = ["fetch", "ncbi", "refseq"]
execution_mode = "durable"
stage = "read"
input_kind = "none"
output_kind = "data"
organelle_types = ["mitochondrion", "plastid"]
output_modalities = ["organelle_records"]
callable_locator = "organelleverse.fetch._agent_ops:op_refseq_snapshot"
side_effects = ["network", "write_files"]
deterministic = false
deterministic_reason = "A null release resolves NCBI's live current release; the resolved release number is recorded in the result manifest."
idempotent = false
cacheable = false

[contract.retry]
max_attempts = 5
retryable_error_codes = ["network.transient", "network.malformed_response"]
