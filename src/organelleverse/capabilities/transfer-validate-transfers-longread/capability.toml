schema = "organelleverse.capability.v1"

[capability]
id = "transfer.validate_transfers_longread"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Validate Transfers Longread"
description = "Validate transfer candidates by long-read linkage (layer 3)."
keywords = ["analyze", "longread", "restored", "result", "transfer", "transfers", "validate"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.transfer.transfer:validate_transfers_longread"
side_effects = ["read_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "nuclear_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "candidates"
codec = "json"

[[contract.binding.parameters]]
name = "hifi_reads"
codec = "path"
