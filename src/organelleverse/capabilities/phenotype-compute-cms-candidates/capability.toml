schema = "organelleverse.capability.v1"

[capability]
id = "phenotype.compute_cms_candidates"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Compute Cms Candidates"
description = "Predict CMS candidate ORFs. Returns dict."
keywords = ["analyze", "candidates", "cms", "compute", "phenotype", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phenotype.cms.core:compute_cms_candidates"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "cms_candidates"

[[contract.binding.parameters]]
name = "fasta_path"
codec = "path"
