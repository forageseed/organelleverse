schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_fst_scan"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot F_ST Scan"
description = "Prepare a sliding-window F_ST profile between two groups along an organelle genome from a VCF (heterozygosity, Weir & Cockerham or Hudson per-site estimators), with dashed boxes over regions of interest; render with ov.write."
keywords = ["differentiation", "fst", "population", "sliding-window", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.popgen_plots:plot_fst_scan"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[[contract.dependencies]]
kind = "python"
name = "scipy"

[[contract.dependencies]]
kind = "python"
name = "Bio"
locator = "biopython"

[[contract.dependencies]]
kind = "python"
name = "vcfpy"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "vcf"
codec = "path"

[[contract.binding.parameters]]
name = "groups"
codec = "json"

[[contract.binding.parameters]]
name = "pair"
codec = "json"

[[contract.binding.parameters]]
name = "estimator"
codec = "json"

[[contract.binding.parameters]]
name = "window_size"
codec = "json"

[[contract.binding.parameters]]
name = "step"
codec = "json"

[[contract.binding.parameters]]
name = "min_snps"
codec = "json"

[[contract.binding.parameters]]
name = "contig"
codec = "json"

[[contract.binding.parameters]]
name = "genome_length"
codec = "json"

[[contract.binding.parameters]]
name = "reference_sample"
codec = "json"

[[contract.binding.parameters]]
name = "highlight"
codec = "json"

[[contract.binding.parameters]]
name = "top_fraction"
codec = "json"

[[contract.binding.parameters]]
name = "group_colors"
codec = "json"

[[contract.binding.parameters]]
name = "title"
codec = "json"

[[contract.binding.parameters]]
name = "organelle"
codec = "json"

[[contract.binding.parameters]]
name = "width"
codec = "json"

[[contract.binding.parameters]]
name = "height"
codec = "json"

[[contract.binding.parameters]]
name = "dpi"
codec = "json"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = {vcf = "fixtures/basic/input/toy.vcf", groups = {W1 = "wild", W2 = "wild", W3 = "wild", W4 = "wild", C1 = "crop", C2 = "crop", C3 = "crop", C4 = "crop"}, pair = ["wild", "crop"], estimator = "hudson", window_size = 500, step = 250, highlight = [{start = 601, end = 900, label = "SV"}]}
expect = "fixtures/basic/expected.json"
equivalence = "exact"
