schema = "organelleverse.capability.v1"

[capability]
id = "coevolution.correlation_matrix"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Correlation Matrix"
description = "All-by-all ERC correlation (pure data function)."
keywords = ["analyze", "coevolution", "correlation", "matrix", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.coevolution.erc_engine:correlation_matrix"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "correlation_matrix"

[[contract.binding.parameters]]
name = "residuals"
codec = "json"
