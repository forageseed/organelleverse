schema = "organelleverse.capability.v1"

[capability]
id = "selection.parse_hyphy_json"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Parse HyPhy JSON"
description = "Parse the key results of an existing HyPhy BUSTED/aBSREL/RELAX/MEME/FEL JSON (local run or Datamonkey); the method is detected from the JSON layout."
keywords = ["datamonkey", "hyphy", "json", "parse", "selection"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.hyphy:parse_hyphy_json"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "hyphy_result"

[[contract.binding.parameters]]
name = "json_path"
codec = "path"

[[contract.binding.parameters]]
name = "method"
codec = "json"

[[contract.binding.parameters]]
name = "alpha"
codec = "json"
