schema = "organelleverse.capability.v1"

[capability]
id = "selection.clade_model"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Clade Model"
description = "Plan clade-model codeml inputs without writing user-facing files."
keywords = ["analyze", "clade", "model", "restored", "result", "selection"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.models:clade_model"
side_effects = ["read_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "alignment"
codec = "path"

[[contract.binding.parameters]]
name = "tree"
codec = "path"

[[contract.binding.parameters]]
name = "run"
codec = "json"
