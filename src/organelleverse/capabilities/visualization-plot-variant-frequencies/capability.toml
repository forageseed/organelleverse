schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_variant_frequencies"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Per-sample Heteroplasmy Frequencies"
description = "Prepare per-sample SNV/InDel alternate-read fraction panels by organelle: points at or above a threshold coloured and shaped by category, a density band below it, genotype bands; render with ov.write."
keywords = ["heteroplasmy", "indel", "snv", "stability", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.stability_plots:plot_variant_frequencies"
side_effects = []
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "variants"
codec = "json"

[[contract.binding.parameters]]
name = "groups"
codec = "json"

[[contract.binding.parameters]]
name = "sample_order"
codec = "json"

[[contract.binding.parameters]]
name = "threshold"
codec = "json"

[[contract.binding.parameters]]
name = "sqrt_scale"
codec = "json"


[[contract.binding.parameters]]
name = "width"
codec = "json"

[[contract.binding.parameters]]
name = "dpi"
codec = "json"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { variants = { samples = ["wt", "mut"], thresholds = { min_alt_fraction = 0.01 }, sites = [{ site_id = "mt:50:A>G", scope = "mitochondrion", seqid = "mt", position = 50, ref = "A", alt = "G", kind = "SNV", masked = false, in_repeat = false }, { site_id = "mt:120:AT>A", scope = "mitochondrion", seqid = "mt", position = 120, ref = "AT", alt = "A", kind = "InDel", masked = false, in_repeat = true }], fractions = [{ sample = "wt", site_id = "mt:50:A>G", alt_count = 0, depth = 200, alt_fraction = 0.0, detected = false, category = "low_confidence" }, { sample = "mut", site_id = "mt:50:A>G", alt_count = 60, depth = 200, alt_fraction = 0.3, detected = true, category = "other" }, { sample = "wt", site_id = "mt:120:AT>A", alt_count = 4, depth = 200, alt_fraction = 0.02, detected = true, category = "repeat_related" }, { sample = "mut", site_id = "mt:120:AT>A", alt_count = 20, depth = 200, alt_fraction = 0.1, detected = true, category = "repeat_related" }] }, groups = { wt = "WT", mut = "mutant" } }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
