schema = "organelleverse.capability.v1"

[capability]
id = "transfer.validate_transfers_depth"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Validate Transfers Depth"
description = "Validate transfer candidates by read depth (layer 2)."
keywords = ["analyze", "depth", "restored", "result", "transfer", "transfers", "validate"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.transfer.transfer:validate_transfers_depth"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "candidates"
codec = "json"

[[contract.binding.parameters]]
name = "bam_path"
codec = "path"
