schema = "organelleverse.capability.v1"

[capability]
id = "visualization.save_plot"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Save Plot"
description = "Save a prepared OrganelleVerse plot object, similar to R ``ggsave``."
keywords = ["analyze", "plot", "restored", "result", "save", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:save_plot"
side_effects = ["write_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "plot"
codec = "legacy_result"

[[contract.binding.parameters]]
name = "output"
codec = "path"
path_role = "output"
