schema = "organelleverse.capability.v1"

[capability]
id = "localization.score_signal_peptide"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Score Signal Peptide"
description = "Predict a signal peptide (SP) via the von Heijne (1986) weight matrix."
keywords = ["analyze", "localization", "peptide", "restored", "result", "score", "signal"]
execution_mode = "inline"
stage = "analyze"
visibility = "step"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.localization.localize_core:score_signal_peptide"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "signal_peptide"

[[contract.binding.parameters]]
name = "seq"
codec = "json"

[[contract.binding.parameters]]
name = "minscore"
codec = "json"

[[contract.binding.parameters]]
name = "organism"
codec = "json"
