schema = "organelleverse.capability.v1"

[capability]
id = "coevolution.fisher"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Fisher"
description = "Fisher estimates with finite JSON and explicit perfect/undefined states."
keywords = ["analyze", "coevolution", "fisher", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
visibility = "internal"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.coevolution.erc_engine:fisher"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "fisher_z"

[[contract.binding.parameters]]
name = "cor"
codec = "json"

[[contract.binding.parameters]]
name = "count"
codec = "json"
