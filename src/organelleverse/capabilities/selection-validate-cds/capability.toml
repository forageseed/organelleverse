schema = "organelleverse.capability.v1"

[capability]
id = "selection.validate_cds"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Validate Cds"
description = "Validate CDS sequences for codeml analysis."
keywords = ["analyze", "cds", "restored", "result", "selection", "validate"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.codeml:validate_cds"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "cds_fasta"
codec = "path"
