description = "Predict transmembrane alpha-helices via the GES hydropathy scale."
keywords = ["analyze", "localization", "restored", "result", "score", "transmembrane"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.localization.localize_core:score_transmembrane"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "transmembrane"

[[contract.binding.parameters]]
name = "seq"
codec = "json"
