schema = "organelleverse.capability.v1"

[capability]
id = "visualization.summarize_synteny_matrix"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Summarize Synteny Matrix"
description = "Return summary metrics for whole-genome synteny matrix inputs."
keywords = ["analyze", "matrix", "restored", "result", "summarize", "synteny", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:summarize_synteny_matrix"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "synteny_summary"

[[contract.binding.parameters]]
name = "blocks"
codec = "json"
