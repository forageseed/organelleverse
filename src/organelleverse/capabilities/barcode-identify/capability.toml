schema = "organelleverse.capability.v1"

[capability]
id = "barcode.identify"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Identify"
description = "Identify a query sequence against a reference barcode DB via k-mer overlap."
keywords = ["analyze", "barcode", "identify", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.barcode.barcode:identify"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "query_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "reference_fasta"
codec = "path"
