schema = "organelleverse.capability.v1"

[capability]
id = "comparative.normalize_genes"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Normalize Genes"
description = "Normalize organelle gene-name variants to canonical names."
keywords = ["analyze", "comparative", "genes", "normalize", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.comparative.compare:normalize_genes"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "gene_name_map"

[[contract.binding.parameters]]
name = "gene_names"
codec = "json"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { gene_names = ["nu1", "coxi", "cytb", "unknown_gene"] }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
