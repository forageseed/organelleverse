schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_network"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Network"
description = "Render a weighted labelled network with deterministic circular layout (compute-only)."
keywords = ["analyze", "network", "plot", "restored", "result", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:plot_network"
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "nodes"
codec = "json"

[[contract.binding.parameters]]
name = "edges"
codec = "json"
