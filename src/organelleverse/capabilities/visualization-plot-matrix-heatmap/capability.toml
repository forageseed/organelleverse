schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_matrix_heatmap"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Matrix Heatmap"
description = "Render a small matrix heatmap with optional cell values (compute-only)."
keywords = ["analyze", "heatmap", "matrix", "plot", "restored", "result", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:plot_matrix_heatmap"
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "matrix"
codec = "json"
