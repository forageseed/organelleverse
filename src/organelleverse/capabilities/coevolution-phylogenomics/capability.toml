schema = "organelleverse.capability.v1"

[capability]
id = "coevolution.phylogenomics"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Phylogenomics"
description = "Plan/run phylogenomics stage: HOG filter -> MAFFT -> IQ-TREE (executor hook)."
keywords = ["analyze", "coevolution", "phylogenomics", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.coevolution.coevolution:phylogenomics"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "orthofinder_dir"
codec = "directory"
path_role = "input"
