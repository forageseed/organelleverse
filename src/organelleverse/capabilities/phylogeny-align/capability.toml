schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.align"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Align"
description = "Align orthologous sequences using one available, real backend."
keywords = ["align", "analyze", "phylogeny", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.phylo:align"
side_effects = ["read_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "input_fasta"
codec = "path"
