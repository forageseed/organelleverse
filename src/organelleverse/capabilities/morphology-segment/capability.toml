schema = "organelleverse.capability.v1"

[capability]
id = "morphology.segment"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Segment"
description = "Segment microscopy with a pinned offline model or an injected executor; measure calibrated masks. Cellpose/micro-SAM instance IDs have no semantic organelle classes."
keywords = ["analyze", "electron-micrograph", "morphology", "restored", "result", "segment"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.morphology.service:segment"
side_effects = ["read_files", "write_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "images"
codec = "path"

[[contract.binding.parameters]]
name = "device"
codec = "json"

[[contract.binding.parameters]]
name = "config"
codec = "path"

[[contract.binding.parameters]]
name = "checkpoint"
codec = "path"

[[contract.binding.parameters]]
name = "measure_objects"
codec = "json"

[[contract.binding.parameters]]
name = "intensity_image"
codec = "path"

[[contract.binding.parameters]]
name = "pixel_size_um"
codec = "json"

[[contract.binding.parameters]]
name = "backend"
codec = "json"

[[contract.binding.parameters]]
name = "is_3d_stack"
codec = "json"

[[contract.binding.parameters]]
name = "micro_sam_model_type"
codec = "json"

[[contract.binding.parameters]]
name = "model_id"
codec = "json"

[[contract.binding.parameters]]
name = "model_dir"
codec = "directory"
path_role = "input"

[[contract.binding.parameters]]
name = "voxel_size_um"
codec = "json"
