schema = "organelleverse.capability.v1"

[capability]
id = "morphology.segment"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Segment"
description = "Segment images with intermediates in a platform-managed run."
keywords = ["analyze", "electron-micrograph", "morphology", "restored", "result", "segment"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.morphology.service:segment"
side_effects = ["read_files", "write_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "images"
codec = "path"
