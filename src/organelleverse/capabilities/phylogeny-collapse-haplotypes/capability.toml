schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.collapse_haplotypes"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Collapse Haplotypes"
description = "Collapse identical sequences to unique haplotypes."
keywords = ["analyze", "collapse", "haplotypes", "phylogeny", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.hapnet:collapse_haplotypes"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "haplotype_collapse"

[[contract.binding.parameters]]
name = "seqs"
codec = "json"
