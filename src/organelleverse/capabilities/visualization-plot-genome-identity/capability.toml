schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_genome_identity"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Genome Identity"
description = "Prepare an mVISTA-style identity plot; render it with ``ov.write``."
keywords = ["analyze", "genome", "identity", "plot", "restored", "result", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:plot_genome_identity"
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "windows"
codec = "json"

[[contract.binding.parameters]]
name = "features"
codec = "json"

[[contract.binding.parameters]]
name = "reference_length"
codec = "json"

[[contract.binding.parameters]]
name = "region"
codec = "json"
