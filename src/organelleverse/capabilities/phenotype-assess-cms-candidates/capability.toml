schema = "organelleverse.capability.v1"

[capability]
id = "phenotype.assess_cms_candidates"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Assess CMS evidence"
description = "Assess independent CMS and conserved-gene Rust LOSAT BLASTP homology, unmatched regions, hydrophobicity hints and descriptive TPM contrasts; no causality inference."
keywords = ["cms", "evidence", "homology", "phenotype", "reference"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phenotype.cms.evidence:assess_cms_candidates"
side_effects = ["read_files", "write_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "protein_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "conserved_proteins_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "cms_proteins_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "expression_tsv"
codec = "path"

[[contract.binding.parameters]]
name = "topology_predictions"
codec = "path"

[[contract.binding.parameters]]
name = "min_identity"
codec = "json"

[[contract.binding.parameters]]
name = "min_homolog_coverage"
codec = "json"

[[contract.binding.parameters]]
name = "min_alignment_aa"
codec = "json"

[[contract.binding.parameters]]
name = "evalue"
codec = "json"

[[contract.binding.parameters]]
name = "tm_window"
codec = "json"

[[contract.binding.parameters]]
name = "tm_threshold"
codec = "json"

[[contract.binding.parameters]]
name = "threads"
codec = "json"

[[contract.binding.parameters]]
name = "timeout"
codec = "json"

[[contract.binding.parameters]]
name = "losat_path"
codec = "json"

[[contract.dependencies]]
kind = "database"
name = "cms_curated_reference"
locator = "ov-asset:phenotype/cms_curated_reference@1.0"

[[fixture]]
case = "invalid_coverage"
input = { kind = "none" }
parameters = { protein_fasta = "fixtures/query.fasta", conserved_proteins_fasta = "fixtures/core.fasta", min_homolog_coverage = 0.0 }
adversarial = true
expect_failure_code = "cms.invalid_threshold"
