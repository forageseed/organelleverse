schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_depth_profile"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Multi-sample Organelle Depth Profile"
description = "Prepare a multi-sample read-depth figure: samples x windows log2 relative-depth heatmap or ridgeline (white = sample median or a reference sample), or a zoomed region with one area track per sample on its own axis; genotype strip, OGDraw gene track, repeat-pair arcs; render with ov.write."
keywords = ["depth", "heteroplasmy", "msh1", "stability", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.stability_plots:plot_depth_profile"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "depth"
codec = "json"

[[contract.binding.parameters]]
name = "groups"
codec = "json"

[[contract.binding.parameters]]
name = "sample_order"
codec = "json"

[[contract.binding.parameters]]
name = "genbank_paths"
codec = "path"

[[contract.binding.parameters]]
name = "repeats"
codec = "json"

[[contract.binding.parameters]]
name = "min_arc_length"
codec = "json"

[[contract.binding.parameters]]
name = "mode"
codec = "json"

[[contract.binding.parameters]]
name = "region"
codec = "json"

[[contract.binding.parameters]]
name = "limit"
codec = "json"

[[contract.binding.parameters]]
name = "reference_sample"
codec = "json"


[[contract.binding.parameters]]
name = "width"
codec = "json"

[[contract.binding.parameters]]
name = "dpi"
codec = "json"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { depth = { window_size = 100, samples = ["wt", "mut"], contigs = [{ seqid = "mt", length = 300, organelle = "mitochondrion" }], profiles = [{ sample = "wt", seqid = "mt", median_depth = 100.0, mean_depth = [100.0, 100.0, 100.0], log2_ratio = [0.0, 0.0, 0.0] }, { sample = "mut", seqid = "mt", median_depth = 100.0, mean_depth = [100.0, 300.0, 50.0], log2_ratio = [0.0, 1.58, -0.99] }] }, groups = { wt = "WT", mut = "mutant" }, repeats = [{ sequence_id = "mt", positions = [20, 200], length = 60, type = "inverted" }], min_arc_length = 50 }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
