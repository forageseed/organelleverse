schema = "organelleverse.capability.v1"

[capability]
id = "coevolution.filter_outlier_tree"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Filter Outlier Tree"
description = "Return ``None`` if the gene tree is an outlier, else the input unchanged."
keywords = ["analyze", "coevolution", "filter", "outlier", "restored", "result", "tree"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.coevolution._bxb_extract:filter_outlier_tree"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "filtered_edges"

[[contract.binding.parameters]]
name = "edge_lengths"
codec = "json"
