schema = "organelleverse.capability.v1"

[capability]
id = "transfer.compute_transfer"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Compute Transfer"
description = "Detect source-derived transfer fragments in the target. Returns dict."
keywords = ["analyze", "compute", "restored", "result", "transfer"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.transfer.transfer_core:compute_transfer"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "transfer_fragments"

[[contract.binding.parameters]]
name = "target_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "source_fasta"
codec = "path"
