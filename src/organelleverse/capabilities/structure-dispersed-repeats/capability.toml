schema = "organelleverse.capability.v1"

[capability]
id = "structure.dispersed_repeats"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Dispersed Repeats"
description = "Fraction of an organelle genome in dispersed repeats from a whole-genome self-alignment (minimap2 asm20, else LOSAT/blastn): merged repeat bases, direct/inverted pairs and length classes."
keywords = ["dispersed", "inverted", "minimap2", "recombination", "repeats", "structure"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.structure.dispersed:dispersed_repeats"
side_effects = ["read_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "genome_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "min_length"
codec = "json"

[[contract.binding.parameters]]
name = "min_identity"
codec = "json"

[[contract.binding.parameters]]
name = "min_mapq"
codec = "json"

[[contract.binding.parameters]]
name = "diagonal_band"
codec = "json"

[[contract.binding.parameters]]
name = "backend"
codec = "json"

[[contract.binding.parameters]]
name = "threads"
codec = "json"
