schema = "organelleverse.capability.v1"

[capability]
id = "localization.install_hint"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Install Hint"
description = "Return a human-readable install guide with URLs."
keywords = ["analyze", "hint", "install", "localization", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.localization.install:install_hint"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "hint_text"

[[contract.binding.parameters]]
name = "name"
codec = "json"
