schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.plan_tree_build"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plan Tree Build"
description = "Plan a tree-building command with each tool's real interface. Returns dict."
keywords = ["analyze", "build", "phylogeny", "plan", "restored", "result", "tree"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.phylo_core:plan_tree_build"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "tree_build_plan"

[[contract.binding.parameters]]
name = "alignment_fasta"
codec = "path"
