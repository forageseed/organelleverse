schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.pairwise_distances"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Pairwise Distances"
description = "All pairwise p-distances between haplotypes."
keywords = ["analyze", "distances", "pairwise", "phylogeny", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.hapnet:pairwise_distances"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "pairwise_distances"

[[contract.binding.parameters]]
name = "haplotypes"
codec = "json"
