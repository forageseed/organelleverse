schema = "organelleverse.capability.v1"

[capability]
id = "heteroplasmy.estimate_structural_fractions"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Estimate Structural Configuration Read Fractions"
description = "Count unique long-read GraphAligner GAF alignments spanning exactly one caller-supplied competing oriented graph junction or path; alternatives share an oriented start or end anchor and results are conditional read fractions with Wilson intervals, not genome molecule copy number."
keywords = ["configuration", "gaf", "graphaligner", "heteroplasmy", "long_read", "substoichiometric"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.heteroplasmy_structural:estimate_structural_fractions"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "gaf_path"
codec = "path"

[[contract.binding.parameters]]
name = "configurations_tsv"
codec = "path"

[[contract.binding.parameters]]
name = "scope"
codec = "json"

[[contract.binding.parameters]]
name = "min_mapping_quality"
codec = "json"
