schema = "organelleverse.capability.v1"

[capability]
id = "phenotype.download_cms_sequences"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Download Cms Sequences"
description = "Fetch pinned reviewed proteins and validate them before atomic cache publication."
keywords = ["analyze", "cms", "download", "phenotype", "restored", "result", "sequences"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phenotype.cms.data.download:download_cms_sequences"
side_effects = ["network", "read_files", "write_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "Bio"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "email"
codec = "json"
