schema = "organelleverse.capability.v1"

[capability]
id = "morphology.training_code_snippet"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Training Code Snippet"
description = "Return a training template with a fixed, editable run directory."
keywords = ["analyze", "code", "morphology", "restored", "result", "snippet", "training"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.morphology.train:training_code_snippet"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "training_snippet"

[[contract.binding.parameters]]
name = "data_root"
codec = "directory"
path_role = "input"
