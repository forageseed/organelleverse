schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_transfer_circos"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Transfer Circos"
description = "Prepare a circos-style chord diagram of MTPT/NUPT/NUMT transfers: recipient and donor sequences on one ring, identity-coloured ribbons sized by fragment length, kb ticks, plastid IR band, gene ring and transferred-gene labels; render with ov.write."
keywords = ["chord", "circos", "mtpt", "numt", "nupt", "transfer", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.circos:plot_transfer_circos"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[[contract.dependencies]]
kind = "python"
name = "Bio"
locator = "biopython"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "transfers"
codec = "json"

[[contract.binding.parameters]]
name = "recipient"
codec = "path"

[[contract.binding.parameters]]
name = "donor"
codec = "path"

[[contract.binding.parameters]]
name = "transfer_kind"
codec = "json"

[[contract.binding.parameters]]
name = "color_by"
codec = "json"

[[contract.binding.parameters]]
name = "min_length"
codec = "json"

[[contract.binding.parameters]]
name = "show_genes"
codec = "json"

[[contract.binding.parameters]]
name = "gene_labels"
codec = "json"

[[contract.binding.parameters]]
name = "minus_labels"
codec = "json"

[[contract.binding.parameters]]
name = "gene_label_min_fraction"
codec = "json"

[[contract.binding.parameters]]
name = "show_ir"
codec = "json"

[[contract.binding.parameters]]
name = "order"
codec = "json"

[[contract.binding.parameters]]
name = "zoom"
codec = "json"

[[contract.binding.parameters]]
name = "title"
codec = "json"

[[contract.binding.parameters]]
name = "width"
codec = "json"

[[contract.binding.parameters]]
name = "dpi"
codec = "json"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = {transfers = [{seqid = "MTFIX.1", start = 495, end = 700, length = 206, identity = 99.52, strand = "-", hsps = [{source_seqid = "CPFIX.1", source_start = 151, source_end = 355, start = 495, end = 700, identity = 99.52, strand = "-", alignment_length = 206}]}, {seqid = "MTFIX.1", start = 1401, end = 1500, length = 100, identity = 100.0, strand = "+", hsps = [{source_seqid = "CPFIX.1", source_start = 1291, source_end = 1390, start = 1401, end = 1500, identity = 100.0, strand = "+", alignment_length = 100}, {source_seqid = "CPFIX.1", source_start = 2811, source_end = 2910, start = 1401, end = 1500, identity = 100.0, strand = "-", alignment_length = 100}]}, {seqid = "MTFIX.1", start = 2401, end = 2700, length = 300, identity = 100.0, strand = "+", hsps = [{source_seqid = "CPFIX.1", source_start = 601, source_end = 900, start = 2401, end = 2700, identity = 100.0, strand = "+", alignment_length = 300}]}], recipient = "fixtures/basic/input/mito.gb", donor = "fixtures/basic/input/plastid.gb"}
expect = "fixtures/basic/expected.json"
equivalence = "exact"
