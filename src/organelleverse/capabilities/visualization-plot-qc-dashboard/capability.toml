schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_qc_dashboard"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Qc Dashboard"
description = "Render an evidence-driven assembly-QC dashboard (compute-only)."
keywords = ["analyze", "dashboard", "plot", "qc", "restored", "result", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:plot_qc_dashboard"
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "metrics"
codec = "json"
