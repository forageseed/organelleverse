schema = "organelleverse.capability.v1"

[capability]
id = "selection.compute_kaks"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Compute Kaks"
description = "Compute pairwise Ka/Ks from CDS. Returns dict."
keywords = ["analyze", "compute", "kaks", "restored", "result", "selection"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.codeml_core:compute_kaks"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "kaks"

[[contract.binding.parameters]]
name = "cds_fasta"
codec = "path"
