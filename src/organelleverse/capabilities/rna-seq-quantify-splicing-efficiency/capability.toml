schema = "organelleverse.capability.v1"
[capability]
id = "rna_seq.quantify_splicing_efficiency"
bundle_version = "1.0.0"
implementation = "native"
[contract]
contract_version = "1.0"
title = "Quantify Annotated Intron Excision"
description = "Estimate splicing efficiency at annotated organelle introns from exact CIGAR N junction and continuous intron-spanning read support."
keywords = ["analyze", "bam", "intron", "rna_seq", "splicing"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.rna_seq.quantification:quantify_splicing_efficiency"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false
[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"
[[contract.binding.parameters]]
name = "bam_path"
codec = "path"
[[contract.binding.parameters]]
name = "introns_tsv"
codec = "path"
[[contract.binding.parameters]]
name = "scope"
codec = "json"
[[contract.binding.parameters]]
name = "min_mapping_quality"
codec = "json"
[[contract.binding.parameters]]
name = "min_anchor"
codec = "json"
[[contract.binding.parameters]]
name = "exclude_duplicates"
codec = "json"
[[contract.binding.parameters]]
name = "reference_fasta"
codec = "path"
