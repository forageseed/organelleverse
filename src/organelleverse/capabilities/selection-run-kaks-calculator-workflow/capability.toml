schema = "organelleverse.capability.v1"

[capability]
id = "selection.run_kaks_calculator_workflow"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Run Kaks Calculator Workflow"
description = "Run KaKs Calculator with intermediate files in managed storage."
keywords = ["analyze", "calculator", "kaks", "restored", "result", "run", "selection", "workflow"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.service:run_kaks_calculator_workflow"
side_effects = ["subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "cds_fasta"
codec = "path"
