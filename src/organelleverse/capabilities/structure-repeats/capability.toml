schema = "organelleverse.capability.v1"

[capability]
id = "structure.repeats"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Repeats"
description = "Detect SSR (simple sequence repeat) motifs in a FASTA."
keywords = ["analyze", "repeats", "restored", "result", "structure"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.structure.structure:repeats"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "genome_fasta"
codec = "path"
