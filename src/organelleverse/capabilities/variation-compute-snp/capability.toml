schema = "organelleverse.capability.v1"

[capability]
id = "variation.compute_snp"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Compute Snp"
description = "Compute SNP/Ti-Tv stats from an alignment. Returns dict."
keywords = ["analyze", "compute", "restored", "result", "snp", "variation"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.variation.snp_core:compute_snp"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "snp_metrics"

[[contract.binding.parameters]]
name = "alignment_fasta"
codec = "path"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { alignment_fasta = "fixtures/basic/input/alignment.fasta" }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
