schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_scatter"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Scatter"
description = "Draw a scatter plot (for Ka/Ks, GC content, etc.) (compute-only)."
keywords = ["analyze", "plot", "restored", "result", "scatter", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.plots:plot_scatter"
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "x"
codec = "json"

[[contract.binding.parameters]]
name = "y"
codec = "json"

[[contract.binding.parameters]]
name = "xlabel"
codec = "json"

[[contract.binding.parameters]]
name = "ylabel"
codec = "json"

[[contract.binding.parameters]]
name = "title"
codec = "json"

[[contract.binding.parameters]]
name = "labels"
codec = "json"

[[contract.binding.parameters]]
name = "highlight_threshold"
codec = "json"

[[contract.binding.parameters]]
name = "dpi"
codec = "json"

[[contract.binding.parameters]]
name = "width"
codec = "json"

[[contract.binding.parameters]]
name = "height"
codec = "json"
