schema = "organelleverse.capability.v1"

[capability]
id = "localization.predict"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Predict"
description = "Predict subcellular localization for proteins in a FASTA file."
keywords = ["analyze", "localization", "predict", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.localization.localize:predict"
side_effects = ["read_files", "write_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "fasta"
codec = "path"
