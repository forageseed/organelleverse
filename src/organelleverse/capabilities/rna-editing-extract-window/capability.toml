schema = "organelleverse.capability.v1"

[capability]
id = "rna_editing.extract_window"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Extract Window"
description = "Extract the 2*flank window around a cytidine, dropping the central C."
keywords = ["analyze", "extract", "restored", "result", "rna_editing", "window"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.rna_editing._plantc2u:extract_window"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "window"

[[contract.binding.parameters]]
name = "sequence"
codec = "json"

[[contract.binding.parameters]]
name = "position_1based"
codec = "json"

[[contract.binding.parameters]]
name = "strand"
codec = "json"
