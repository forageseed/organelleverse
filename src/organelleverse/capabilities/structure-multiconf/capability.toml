schema = "organelleverse.capability.v1"

[capability]
id = "structure.multiconf"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Multiconf"
description = "Report repeat-pair recombination candidates separately for each record."
keywords = ["analyze", "multiconf", "restored", "result", "structure"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.structure.structure:multiconf"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "genome_fasta"
codec = "path"
