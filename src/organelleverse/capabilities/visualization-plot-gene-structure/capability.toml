schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_gene_structure"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Gene Structure"
description = "Render a linear gene-structure diagram with gbdraw (compute-only)."
keywords = ["analyze", "gene", "plot", "restored", "result", "structure", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.gbdraw:plot_gene_structure"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "inputs"
codec = "path"

[[contract.binding.parameters]]
name = "show_labels"
codec = "json"

[[contract.binding.parameters]]
name = "separate_strands"
codec = "json"

[[contract.binding.parameters]]
name = "label_placement"
codec = "json"

[[contract.binding.parameters]]
name = "track_layout"
codec = "json"
