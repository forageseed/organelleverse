schema = "organelleverse.capability.v1"

[capability]
id = "coevolution.extract_branch_lengths"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Extract Branch Lengths"
description = "Extract branch-length vectors from multiple gene trees."
keywords = ["analyze", "branch", "coevolution", "extract", "lengths", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.coevolution.coevolution:extract_branch_lengths"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "gene_trees"
codec = "json"
