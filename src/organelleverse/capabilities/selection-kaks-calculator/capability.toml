schema = "organelleverse.capability.v1"

[capability]
id = "selection.kaks_calculator"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Kaks Calculator"
description = "Compute Ka/Ks metrics without binding a user-facing output directory."
keywords = ["analyze", "calculator", "kaks", "restored", "result", "selection"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.kaks_calculator:kaks_calculator"
side_effects = ["read_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "cds_fasta"
codec = "path"
