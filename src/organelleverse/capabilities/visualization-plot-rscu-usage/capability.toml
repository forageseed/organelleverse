schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_rscu_usage"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Rscu Usage"
description = "Render RSCU codon-usage bias as amino-acid grouped codon stacks (compute-only)."
keywords = ["analyze", "plot", "restored", "result", "rscu", "usage", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:plot_rscu_usage"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "rscu_rows"
codec = "path"
