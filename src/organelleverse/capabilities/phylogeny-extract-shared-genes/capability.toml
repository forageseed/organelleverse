schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.extract_shared_genes"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Extract Shared Genes"
description = "Extract genes shared across multiple annotated genomes (PhyloSuite-style)."
keywords = ["analyze", "extract", "genes", "phylogeny", "restored", "result", "shared"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.phylo:extract_shared_genes"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "Bio"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "genbank_paths"
codec = "path"
