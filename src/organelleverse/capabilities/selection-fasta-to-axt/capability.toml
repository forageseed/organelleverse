schema = "organelleverse.capability.v1"

[capability]
id = "selection.fasta_to_axt"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Fasta To Axt"
description = "Convert aligned FASTA to an AXT artifact in managed storage."
keywords = ["analyze", "axt", "fasta", "restored", "result", "selection", "to"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.service:fasta_to_axt"
side_effects = ["read_files", "write_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "fasta_path"
codec = "path"
