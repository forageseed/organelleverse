schema = "organelleverse.capability.v1"

[capability]
id = "coevolution.species_tree_edges"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Species Tree Edges"
description = "Enumerate species-tree edges as ``\"{ancestor}_to_{descendant}\"`` keys."
keywords = ["analyze", "coevolution", "edges", "restored", "result", "species", "tree"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.coevolution._bxb_extract:species_tree_edges"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "edges"

[[contract.binding.parameters]]
name = "species_tree_newick"
codec = "json"
