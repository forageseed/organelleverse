schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.compute_alignment"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Compute Alignment"
description = "Compute a real alignment with the same backend contract as align()."
keywords = ["alignment", "analyze", "compute", "phylogeny", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.phylo_core:compute_alignment"
side_effects = ["read_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "alignment"

[[contract.binding.parameters]]
name = "input_fasta"
codec = "path"
