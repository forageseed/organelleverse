schema = "organelleverse.capability.v1"

[capability]
id = "selection.pal2nal"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Pal2nal"
description = "Back-align a protein MSA onto CDS sequences to produce a codon alignment."
keywords = ["analyze", "pal2nal", "restored", "result", "selection"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.codeml:pal2nal"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "protein_alignment_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "cds_fasta"
codec = "path"
