schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.trim_alignment"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Trim Alignment"
description = "Trim an alignment to remove poorly-aligned columns (trimAl)."
keywords = ["alignment", "analyze", "phylogeny", "restored", "result", "trim"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.phylo:trim_alignment"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "alignment_fasta"
codec = "path"
