case = "basic"
input = { kind = "none" }
parameters = {groups = {W1 = "wild", W2 = "wild", W3 = "wild", W4 = "wild", C1 = "crop", C2 = "crop", C3 = "crop", C4 = "crop"}, gfa = "fixtures/basic/input/toy.gfa", reference = "REF", min_length = 100}
expect = "fixtures/basic/expected.json"
