schema = "organelleverse.capability.v1"

[capability]
id = "selection.batch_codeml"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Batch Codeml"
description = "Run multiple codeml jobs in parallel using multiprocessing."
keywords = ["analyze", "batch", "codeml", "restored", "result", "selection"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.models:batch_codeml"
side_effects = ["read_files", "write_files", "subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "jobs"
codec = "json"
