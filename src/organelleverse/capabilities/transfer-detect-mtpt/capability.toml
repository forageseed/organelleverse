schema = "organelleverse.capability.v1"

[capability]
id = "transfer.detect_mtpt"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Detect Mtpt"
description = "Detect mitochondrial plastid-derived DNA transfers (MTPTs) by local alignment."
keywords = ["analyze", "detect", "mtpt", "restored", "result", "transfer"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.transfer.transfer:detect_mtpt"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "mito_fasta"
codec = "path"

[[contract.binding.parameters]]
name = "cp_fasta"
codec = "path"
