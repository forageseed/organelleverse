schema = "organelleverse.capability.v1"

[capability]
id = "morphology.check_backend"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Check Backend"
description = "Check if the OrgSegNet backend is available."
keywords = ["analyze", "backend", "check", "morphology", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.morphology.install:check_backend"
side_effects = ["subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "backend_status"

[[contract.binding.parameters]]
name = "name"
codec = "json"
