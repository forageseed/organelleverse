schema = "organelleverse.capability.v1"

[capability]
id = "barcode.design_barcode"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Design Barcode"
description = "Design barcode regions from a multi-species alignment."
keywords = ["analyze", "barcode", "design", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.barcode.barcode:design_barcode"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "alignment_fasta"
codec = "path"
