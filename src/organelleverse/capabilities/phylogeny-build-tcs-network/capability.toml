schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.build_tcs_network"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Build Tcs Network"
description = "TCS statistical-parsimony network (Clement, Posada & Crandall 2000)."
keywords = ["analyze", "build", "network", "phylogeny", "restored", "result", "tcs"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.hapnet:build_tcs_network"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "tcs_network"

[[contract.binding.parameters]]
name = "haplotypes"
codec = "json"

[[contract.binding.parameters]]
name = "members"
codec = "json"
