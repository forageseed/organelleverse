schema = "organelleverse.capability.v1"

[capability]
id = "annotation.write_orfs"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Write organelle ORFs"
description = "Write CDS FASTA, protein FASTA, and GFF3 with transcript-ordered parts and reading phases."
keywords = ["annotation", "fasta", "gff3", "orf"]
execution_mode = "inline"
stage = "consume"
input_kind = "result"
output_kind = "result"
callable_locator = "organelleverse.annotation.orfs:write_orfs"
side_effects = ["read_files", "write_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "canonical_core"
result_codec = "canonical"
