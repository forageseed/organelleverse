schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_phylo_tree"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Annotated Phylogenetic Tree"
description = "Prepare a rectangular or circular phylogenetic tree with support symbols, coloured tip groups, clade brackets and tip-data strips or rings (presence/absence, numeric, categorical); render with ov.write."
keywords = ["circular", "clade", "phylogeny", "support", "tree", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.tree_plots:plot_phylo_tree"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[[contract.dependencies]]
kind = "python"
name = "Bio"
locator = "biopython"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "tree"
codec = "path"

[[contract.binding.parameters]]
name = "layout"
codec = "json"

[[contract.binding.parameters]]
name = "outgroup"
codec = "json"

[[contract.binding.parameters]]
name = "midpoint_root"
codec = "json"

[[contract.binding.parameters]]
name = "support"
codec = "json"

[[contract.binding.parameters]]
name = "tip_groups"
codec = "path"

[[contract.binding.parameters]]
name = "clades"
codec = "json"

[[contract.binding.parameters]]
name = "tip_data"
codec = "path"

[[contract.binding.parameters]]
name = "rename"
codec = "json"

[[contract.binding.parameters]]
name = "width"
codec = "json"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { tree = "fixtures/basic/input/nuclear.nwk", layout = "circular", outgroup = ["Amborella trichopoda"], tip_groups = "fixtures/basic/input/groups.tsv", tip_data = "fixtures/basic/input/traits.tsv", clades = { Rosids = ["Arabidopsis thaliana", "Glycine max"] } }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
