schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.build_msn"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Build Msn"
description = "Minimum-spanning network: Kruskal greedy join at ascending distances."
keywords = ["analyze", "build", "msn", "phylogeny", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.hapnet:build_msn"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "msn_network"

[[contract.binding.parameters]]
name = "haplotypes"
codec = "json"
