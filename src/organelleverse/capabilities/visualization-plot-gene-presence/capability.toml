schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_gene_presence"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Gene Presence"
description = "Prepare a species-by-gene presence, pseudogene, transfer and absence matrix with functional-class headers and an optional tree; render with ov.write."
keywords = ["gene-content", "matrix", "presence", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.paper_figures:plot_gene_presence"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[[contract.dependencies]]
kind = "python"
name = "Bio"
locator = "biopython"

[[contract.dependencies]]
kind = "python"
name = "scipy"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "genbank_path"
codec = "path"

[[contract.binding.parameters]]
name = "tree_path"
codec = "path"

[[contract.binding.parameters]]
name = "names"
codec = "json"

[[contract.binding.parameters]]
name = "order"
codec = "json"

[[contract.binding.parameters]]
name = "genes"
codec = "json"

[[contract.binding.parameters]]
name = "transferred"
codec = "json"

[[contract.binding.parameters]]
name = "variable_only"
codec = "json"

[[contract.binding.parameters]]
name = "include_trna"
codec = "json"

[[contract.binding.parameters]]
name = "include_rrna"
codec = "json"

[[contract.binding.parameters]]
name = "include_orfs"
codec = "json"

[[contract.binding.parameters]]
name = "trna_names"
codec = "json"

[[contract.binding.parameters]]
name = "organelle"
codec = "json"

[[contract.binding.parameters]]
name = "width"
codec = "json"

[[contract.binding.parameters]]
name = "cell_mm"
codec = "json"

[[contract.binding.parameters]]
name = "columns_per_block"
codec = "json"

[[contract.binding.parameters]]
name = "dpi"
codec = "json"

[[fixture]]
case = "basic"
input = { kind = "none" }
parameters = { genbank_path = ["fixtures/basic/input/A.gb", "fixtures/basic/input/B.gb", "fixtures/basic/input/C.gb"], tree_path = "fixtures/basic/input/t.nwk", transferred = { "Gamma three" = ["ndhB"] } }
expect = "fixtures/basic/expected.json"
equivalence = "exact"
