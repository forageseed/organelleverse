schema = "organelleverse.capability.v1"

[capability]
id = "coevolution.run_erc"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Run Erc"
description = "Full ERC 2.0 pipeline: project \u2192 residual \u2192 correlate \u2192 Fisher \u2192 permute (rooted trees in)."
keywords = ["analyze", "coevolution", "erc", "restored", "result", "run"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.coevolution.erc_engine:run_erc"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "gene_trees"
codec = "json"

[[contract.binding.parameters]]
name = "species_tree_newick"
codec = "json"
