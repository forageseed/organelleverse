schema = "organelleverse.capability.v1"

[capability]
id = "phenotype.cms"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Cms"
description = "Predict CMS candidate genes from a mitochondrial FASTA."
keywords = ["analyze", "cms", "phenotype", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phenotype.cms.pipeline:cms"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "genome_fasta"
codec = "path"
