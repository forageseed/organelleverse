schema = "organelleverse.capability.v1"

[capability]
id = "visualization.plot_rna_editing_summary"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Plot Rna Editing Summary"
description = "Render per-gene RNA-editing site counts, stacked by editing class (compute-only)."
keywords = ["analyze", "editing", "plot", "restored", "result", "rna", "summary", "visualization"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.visualization.suite_plots:plot_rna_editing_summary"
deterministic = true
idempotent = true
cacheable = false

[[contract.dependencies]]
kind = "python"
name = "matplotlib"

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"

[[contract.binding.parameters]]
name = "editing_sites"
codec = "json"
