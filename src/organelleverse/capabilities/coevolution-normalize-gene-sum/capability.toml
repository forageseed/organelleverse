schema = "organelleverse.capability.v1"

[capability]
id = "coevolution.normalize_gene_sum"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Normalize Gene Sum"
description = "Normalize each gene's BXB vector by its non-missing branch-length sum."
keywords = ["analyze", "coevolution", "gene", "normalize", "restored", "result", "sum"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.coevolution._bxb_extract:normalize_gene_sum"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "normalized_matrix"

[[contract.binding.parameters]]
name = "matrix"
codec = "json"
