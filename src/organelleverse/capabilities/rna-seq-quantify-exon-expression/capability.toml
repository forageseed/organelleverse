schema = "organelleverse.capability.v1"
[capability]
id = "rna_seq.quantify_exon_expression"
bundle_version = "1.0.0"
implementation = "native"
[contract]
contract_version = "1.0"
title = "Summarize Organelle Exon Expression"
description = "Count annotated exon-overlapping RNA-seq alignments per gene and report library-size normalized CPM."
keywords = ["analyze", "bam", "exon", "expression", "rna_seq"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.rna_seq.quantification:quantify_exon_expression"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false
[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"
[[contract.binding.parameters]]
name = "bam_path"
codec = "path"
[[contract.binding.parameters]]
name = "exons_tsv"
codec = "path"
[[contract.binding.parameters]]
name = "scope"
codec = "json"
[[contract.binding.parameters]]
name = "min_mapping_quality"
codec = "json"
[[contract.binding.parameters]]
name = "exclude_duplicates"
codec = "json"
[[contract.binding.parameters]]
name = "reference_fasta"
codec = "path"
