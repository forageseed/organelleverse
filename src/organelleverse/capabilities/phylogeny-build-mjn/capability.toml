schema = "organelleverse.capability.v1"

[capability]
id = "phylogeny.build_mjn"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Build Mjn"
description = "Median-joining network (Bandelt, Forster & R\u00f6hl 1999)."
keywords = ["analyze", "build", "mjn", "phylogeny", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phylogeny.hapnet:build_mjn"
