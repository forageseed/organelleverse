schema = "organelleverse.capability.v1"

[capability]
id = "qc.filter_long_reads"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Filter and subsample long reads"
description = "Filter ONT/HiFi by length and arithmetic mean Phred+33; retain the quality-ranked whole-read prefix reaching a target base count."
keywords = ["fastq", "quality-control", "reads"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.quality_control.api:filter_long_reads"
side_effects = ["read_files", "write_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "reads"
codec = "path"

[[contract.binding.parameters]]
name = "min_length"
codec = "json"

[[contract.binding.parameters]]
name = "min_mean_quality"
codec = "json"

[[contract.binding.parameters]]
name = "target_bases"
codec = "json"
