schema = "organelleverse.capability.v1"

[capability]
id = "comparative.compare_genes"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Compare Genes"
description = "Compare gene presence across species (intersection / union / differences)."
keywords = ["analyze", "comparative", "compare", "genes", "genome", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "genome"
input_sequence = true
output_kind = "result"
callable_locator = "organelleverse.comparative.compare:compare_genes"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "canonical_core"
result_codec = "canonical"
