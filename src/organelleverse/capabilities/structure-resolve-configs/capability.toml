schema = "organelleverse.capability.v1"

[capability]
id = "structure.resolve_configs"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Resolve Configs"
description = "Resolve sub-genomic configurations from repeat-mediated recombination."
keywords = ["analyze", "configs", "resolve", "restored", "result", "structure"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.structure.structure:resolve_configs"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "genome_fasta"
codec = "path"
