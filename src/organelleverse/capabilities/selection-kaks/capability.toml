schema = "organelleverse.capability.v1"

[capability]
id = "selection.kaks"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Kaks"
description = "Compute Ka/Ks for all pairs of CDS sequences using NG86."
keywords = ["analyze", "kaks", "restored", "result", "selection"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.kaks:kaks"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "cds_pairs_fasta"
codec = "path"
