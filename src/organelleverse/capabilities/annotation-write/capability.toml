schema = "organelleverse.capability.v1"

[capability]
id = "annotation.write"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Write an annotation result"
description = "Atomically materializes a non-failed canonical annotation result to a caller-selected destination."
keywords = ["annotation", "publish", "write"]
execution_mode = "inline"
stage = "consume"
input_kind = "result"
output_kind = "result"
organelle_types = ["mitochondrion", "plastid"]
callable_locator = "organelleverse.annotation.api:write"
side_effects = ["read_files", "write_files"]
deterministic = true
idempotent = true
cacheable = false
references = ["docs/reports/annotation_release/README.md"]
