schema = "organelleverse.capability.v1"

[capability]
id = "phenotype.cms_reference_json"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Cms Reference Json"
description = "Return metadata for the accession-checked ORF79/ORF138 seed."
keywords = ["analyze", "cms", "json", "phenotype", "reference", "restored", "result"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.phenotype.cms.resources:cms_reference_json"
side_effects = ["read_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "artifact"
