schema = "organelleverse.capability.v1"

[capability]
id = "selection.check_kaks_calculator"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Check Kaks Calculator"
description = "Check if KaKs_Calculator is installed (PATH + all conda envs)."
keywords = ["analyze", "calculator", "check", "kaks", "restored", "result", "selection"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.kaks_calculator:check_kaks_calculator"
side_effects = ["subprocess"]
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "kaks_calculator_status"
