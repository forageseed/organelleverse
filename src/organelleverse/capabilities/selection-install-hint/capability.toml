schema = "organelleverse.capability.v1"

[capability]
id = "selection.install_hint"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Install Hint"
description = "Install guide for KaKs_Calculator."
keywords = ["analyze", "hint", "install", "restored", "result", "selection"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.selection.kaks_calculator:install_hint"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "hint_text"
