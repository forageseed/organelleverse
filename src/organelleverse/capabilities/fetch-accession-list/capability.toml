schema = "organelleverse.capability.v1"

[capability]
id = "fetch.accession_list"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Fetch organelle records by accession"
description = "Downloads organelle records for a caller-supplied, explicit list of accessions, reproducing someone else's named dataset exactly."
keywords = ["accession", "fetch", "ncbi"]
execution_mode = "durable"
stage = "read"
input_kind = "none"
output_kind = "data"
organelle_types = ["mitochondrion", "plastid"]
output_modalities = ["organelle_records"]
callable_locator = "organelleverse.fetch._agent_ops:op_accession_list"
side_effects = ["network", "write_files"]
deterministic = true
idempotent = true
cacheable = false

[contract.retry]
max_attempts = 5
retryable_error_codes = ["network.transient", "network.malformed_response"]
