schema = "organelleverse.capability.v1"

[capability]
id = "coevolution.reconcile_trees"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Reconcile Trees"
description = "Reconcile a gene tree against a species tree using LCA mapping."
keywords = ["analyze", "coevolution", "reconcile", "restored", "result", "trees"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.coevolution.coevolution:reconcile_trees"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "canonical"

[[contract.binding.parameters]]
name = "gene_tree_newick"
codec = "json"

[[contract.binding.parameters]]
name = "species_tree_newick"
codec = "json"
