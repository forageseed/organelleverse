schema = "organelleverse.capability.v1"

[capability]
id = "localization.score_nls"
bundle_version = "1.0.0"
implementation = "native"

[contract]
contract_version = "1.0"
title = "Score Nls"
description = "Detect classical nuclear localization signals."
keywords = ["analyze", "localization", "nls", "restored", "result", "score"]
execution_mode = "inline"
stage = "analyze"
input_kind = "none"
output_kind = "result"
callable_locator = "organelleverse.localization.localize_core:score_nls"
deterministic = true
idempotent = true
cacheable = false

[contract.binding]
argument_mode = "named_parameters"
result_codec = "json_metric"
result_key = "nls"

[[contract.binding.parameters]]
name = "seq"
codec = "json"
